# Tablet suspend behaviour. Installed to /etc/systemd/sleep.conf.d/ by install-kiosk.sh.
#
# systemd's default SuspendState is "mem standby freeze": if a suspend attempt
# aborts (e.g. an early wake event, such as the power button being pressed while
# suspend is still entering), systemd silently retries with the next state and
# puts the machine right back to sleep. On the Surface Go that made a wake press
# during the entry window look like "nothing happened" — screen stayed black.
#
# One state only: an aborted attempt stays awake, with visible feedback.
[Sleep]
SuspendState=mem