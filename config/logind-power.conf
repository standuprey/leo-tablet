# Power button behaviour for Léo's tablet.
# Installed to /etc/systemd/logind.conf.d/ by install-kiosk.sh.
#
# The Surface Go's power button reports an atomic press+release (Intel HID
# 5 button array: the EC never tells the OS how long the button was held),
# so logind can neither sleep-on-release nor poweroff-on-hold. The button
# is therefore ignored here and owned entirely by leopowerd.service:
#   press while screen on    -> screen off
#   press while screen off   -> screen on
#   screen off for 60 s      -> suspend
# Power off is a parent-mode action (Power off tile), never the button.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore